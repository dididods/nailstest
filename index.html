<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div class="app-shell" id="appShell">
  <aside class="sidebar">
    <a class="brand" href="#" data-view="today"><span class="brand-mark">л</span><span><strong>лінія</strong><small>студія манікюру</small></span></a>
    <div class="side-label">РОБОЧИЙ ПРОСТІР</div>
    <nav class="side-nav" aria-label="Головна навігація">
      <button class="nav-item active" data-view="today"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Сьогодні <span class="nav-count" id="todayCount">3</span></button>
      <button class="nav-item" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18M8 13h2m4 0h2m-8 4h2"/></svg>Календар</button>
      <button class="nav-item" data-view="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0m2-13a4 4 0 0 1 0 8m1 2a6 6 0 0 1 3 5"/></svg>Клієнтки</button>
      <button class="nav-item" data-view="services"><svg viewBox="0 0 24 24"><path d="M12 3v18m9-9H3"/><circle cx="12" cy="12" r="9"/></svg>Послуги</button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="online-card"><div class="online-top"><span class="live-dot"></span><span>ОНЛАЙН-ЗАПИС</span></div><p>Твої клієнтки можуть записатися самостійно</p><button class="copy-link" id="copyLink"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7m2.7 6.4a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.7-1.7"/></svg>Копіювати посилання</button></div>
    <button class="profile"><span class="avatar avatar-owner">О</span><span><b>Олена Коваль</b><small>Власниця студії</small></span><svg class="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </aside>
  <main class="main-area">
    <header class="topbar"><div class="mobile-brand"><span class="brand-mark">л</span><strong>лінія</strong></div><div class="breadcrumbs" id="breadcrumbs">Мій простір <span>/</span> Сьогодні</div><div class="top-actions"><button class="icon-btn" aria-label="Сповіщення" id="notifyBtn"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg><i></i></button><button class="top-date" id="topDate"></button><button class="button button-dark top-add" id="addBooking"><span>＋</span> Новий запис</button></div></header>
    <section class="view active" id="view-today"></section><section class="view" id="view-calendar"></section><section class="view" id="view-clients"></section><section class="view" id="view-services"></section>
  </main>
  <nav class="mobile-nav" aria-label="Основна навігація"><button class="active" data-view="today"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>День</span></button><button data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18"/></svg><span>Календар</span></button><button class="mobile-add" id="mobileAdd" aria-label="Створити запис">＋</button><button data-view="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0m2-13a4 4 0 0 1 0 8m1 2a6 6 0 0 1 3 5"/></svg><span>Клієнтки</span></button><button data-view="services"><svg viewBox="0 0 24 24"><path d="M12 3v18m9-9H3"/><circle cx="12" cy="12" r="9"/></svg><span>Послуги</span></button></nav>
</div>
<div class="intro-splash" id="introSplash" aria-hidden="true">
  <div class="intro-scene">
    <img class="intro-photo" src="assets/polish-cutout.png" alt="">
    <svg class="intro-liquid" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="gelBody" x1="0" y1="0" x2="1" y2=".35">
          <stop offset="0" stop-color="#ff6f9d"/><stop offset=".24" stop-color="#f42667"/>
          <stop offset=".62" stop-color="#c30f4d"/><stop offset=".82" stop-color="#f53771"/><stop offset="1" stop-color="#a40c3f"/>
        </linearGradient>
        <radialGradient id="gelCore" cx=".35" cy=".24" r=".85">
          <stop offset="0" stop-color="#ff94b4" stop-opacity=".82"/><stop offset=".37" stop-color="#f73170" stop-opacity=".26"/><stop offset="1" stop-color="#790b36" stop-opacity=".48"/>
        </radialGradient>
        <filter id="gelSurface" x="-20%" y="-12%" width="140%" height="130%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".018 .035" numOctaves="1" seed="9" result="grain">
            <animate attributeName="baseFrequency" values=".018 .035;.014 .029;.02 .038" dur="1.7s" repeatCount="1"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.2" xChannelSelector="R" yChannelSelector="G">
            <animate attributeName="scale" values="1.5;5;2;0" keyTimes="0;.58;.78;1" dur="1.8s" fill="freeze"/>
          </feDisplacementMap>
        </filter>
        <filter id="softGloss" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
      </defs>
      <g class="gel-stream" filter="url(#gelSurface)">
        <path d="M426 622 C432 633 443 633 449 622 C452 646 467 674 465 695 C463 718 447 733 430 726 C412 717 409 695 414 675 C417 652 422 637 426 622 Z" fill="url(#gelBody)">
          <animate attributeName="d" dur="1.78s" fill="freeze" calcMode="spline" keyTimes="0;.19;.43;.67;1" keySplines=".36 0 .65 1;.28 .05 .48 .92;.35 0 .68 1;.3 0 .7 1" values="M426 622 C432 633 443 633 449 622 C452 646 467 674 465 695 C463 718 447 733 430 726 C412 717 409 695 414 675 C417 652 422 637 426 622 Z;M426 622 C432 633 443 633 449 622 C451 700 453 803 459 884 C461 919 463 945 468 952 C477 950 481 928 480 894 C476 806 473 700 477 622 C464 634 440 634 426 622 Z;M426 622 C432 633 443 633 449 622 C451 741 455 845 460 930 C461 946 464 954 468 957 C474 953 476 944 476 929 C478 840 474 738 477 622 C464 634 440 634 426 622 Z;M426 622 C432 633 443 633 449 622 C452 684 455 761 460 836 C462 869 465 888 469 895 C477 889 479 868 478 836 C476 760 473 684 477 622 C464 634 440 634 426 622 Z;M426 622 C432 633 443 633 449 622 C452 646 467 674 465 695 C463 718 447 733 430 726 C412 717 409 695 414 675 C417 652 422 637 426 622 Z"/>
        </path>
        <animate attributeName="opacity" begin=".12s" dur="1.88s" fill="freeze" values="1;1;.96;0;0" keyTimes="0;.55;.7;.84;1"/>
      </g>
      <path class="gel-glint" d="M417 667 C413 679 410 693 414 700" fill="none" stroke="#fff1f6" stroke-width="4" stroke-linecap="round" opacity=".78"/>
      <g class="falling-gel" opacity="0">
        <path d="M452 895 C454 912 447 925 444 940 C438 962 449 982 464 984 C482 986 492 967 485 948 C480 932 469 914 468 895 C463 901 457 901 452 895 Z" fill="url(#gelBody)"/>
        <ellipse cx="456" cy="934" rx="5" ry="17" fill="#fff2f7" opacity=".78" transform="rotate(11 456 934)" filter="url(#softGloss)"/>
        <animate attributeName="opacity" begin="1.25s" dur="1.05s" fill="freeze" values="0;0;1;1;0" keyTimes="0;.28;.42;.78;1"/>
        <animateTransform attributeName="transform" type="translate" begin="1.67s" dur=".6s" fill="freeze" calcMode="spline" keySplines=".28 .04 .63 .98" values="0 0;4 104"/>
      </g>
      <ellipse class="landing-ripple" cx="465" cy="1048" rx="34" ry="6" fill="none" stroke="#d92f6b" stroke-width="3" opacity="0"/>
      <ellipse class="landing-ripple second" cx="465" cy="1048" rx="19" ry="3" fill="none" stroke="#f8759c" stroke-width="2" opacity="0"/>
    </svg>
  </div>
  <div class="intro-wordmark"><span class="intro-dot"></span> лінія <small>studio</small></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status"></div>
